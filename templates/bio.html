{% extends "base.html" %}
{% block main %}<article><h1>{{ page.title }}</h1><div class="prose">{{ page.content | safe }}</div>
<section><h2>Photos for publication</h2><p>Click to download larger images.</p><div class="headshots">
{% set headshots = load_data(path='data/headshots.json') %}{% for photo in headshots %}<figure id="{{ photo.id }}"><a href="{{ config.extra.asset_base ~ '/' ~ photo.download }}" download><img src="{{ config.extra.asset_base ~ '/' ~ photo.image }}" alt="Daniel Maher, publication headshot {{ loop.index }}" loading="lazy"></a>{% if photo.attribution %}<figcaption>{{ photo.attribution }}</figcaption>{% endif %}</figure>{% endfor %}</div></section></article>{% endblock %}
