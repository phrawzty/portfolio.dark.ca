[project]
name = "speaking-portfolio"
version = "0.1.0"
description = "Local publishing tools for Daniel Maher's speaking portfolio"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "tomlkit>=0.13,<1", "pypdf>=6,<7"]

[project.scripts]
portfolio = "portfolio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]
